name: Clean Android CI

on:
  push:
    branches: [ clean ]
    paths:
      - 'Android/**'
      - '.github/workflows/clean-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: Android/**/*.gradle*
      - name: Compile debug APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
